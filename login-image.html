<body class="auth-split"><div class="pane"><div class="auth-box"><a class="brand" href="index.html" style="margin-bottom:24px;display:inline-flex"><span class="brand-mark">N</span> Nuvora</a>
    <h2>Sign in</h2>
    <form data-validate><div class="form-group"><label for="email">Email</label><input id="email" type="email" class="form-control-nuvora" required></div>
    <div class="form-group"><label for="password">Password</label><input id="password" type="password" class="form-control-nuvora" required></div><label class="check-row"><span><input type="checkbox"> Remember me</span><a href="reset-password.html">Forgot password?</a></label><button class="btn-nuvora primary block" type="submit">Log in</button>
    <div class="or-div">or</div>
    <button class="btn-nuvora outline block" type="button"><i class="bi bi-google"></i> Continue with Google</button>
    <p style="margin-top:16px;text-align:center">New here? <a href="signup-image.html">Create an account</a></p>
    <p class="form-msg"></p></form></div></div>
    <div class="visual"><img src="assets/images/content/auth-side.webp" alt="Abstract Nuvora artwork"></div>
