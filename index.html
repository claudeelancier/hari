<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sri Murugan Travel Agency — Madurai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/hero.css" />
  </head>
  <body>
    <section class="hero" id="hero">
      <div class="scenes" id="scenes"></div>
      <div class="veil" aria-hidden="true"></div>

      <header class="nav">
        <a class="brand" href="https://www.srimurugantravel.com/">
          <b>SM</b>
          <span>Sri Murugan Travels<small>IATA · Since 1985 · Madurai</small></span>
        </a>
        <nav>
          <a href="https://www.srimurugantravel.com/">Tours</a>
          <a href="https://www.srimurugantravel.com/rameshwaram">Rameshwaram</a>
          <a href="https://www.srimurugantravel.com/">International</a>
        </nav>
        <a class="call" href="tel:+919791848265">97918 48265</a>
      </header>

      <div class="hud" id="hud">
        <p class="in in-1 kicker" id="kicker">Temple city</p>
        <p class="in in-2 num" id="num">01 / 05 · arriving</p>
        <h1 class="in in-3 title" id="title">MEENAKSHI</h1>
        <p class="in in-4 tamil" id="tamil">மீனாட்சி · மதுரை</p>
        <p class="in in-5 lede" id="lede"></p>
        <p class="in in-6 fare"><span id="fare">5,500</span><small>INR onwards · Ex Madurai</small></p>
        <div class="in in-7 cta">
          <a class="cta__main" href="https://www.srimurugantravel.com/">Book this journey</a>
          <a class="cta__ghost" href="tel:+919791848265">Talk to SMTA</a>
        </div>
      </div>

      <div class="arrivals" id="arrivals"></div>
    </section>
    <script src="./js/hero.js"></script>
  </body>
</html>
