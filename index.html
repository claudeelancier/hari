<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hari — Software Engineer</title>
    <meta
      name="description"
      content="Hari — software engineer. Precision product craft, cinematic interfaces, production-grade engineering."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="hero" id="hero" aria-label="Hero">
      <canvas id="hero-canvas"></canvas>
      <div class="hero__veil"></div>
      <div class="hero__grain"></div>
      <div class="hero__vignette"></div>

      <header class="hero__nav">
        <span class="mark">HARI</span>
        <span class="status"><i></i> Open to roles</span>
      </header>

      <div class="hero__copy">
        <p class="eyebrow">
          <span>Software Engineer</span>
          <span class="dot"></span>
          <span>Product Systems</span>
        </p>
        <h1>
          <span class="line">I design software</span>
          <span class="line italic">that feels inevitable.</span>
        </h1>
        <p class="lede">
          Cinematic interfaces. Quiet architecture. Work that survives the
          first impression and the sixth month.
        </p>
        <div class="cta">
          <a class="btn btn--solid" href="#work">View selected work</a>
          <a class="btn btn--ghost" href="#contact">Let’s talk</a>
        </div>
      </div>

      <aside class="hero__meta" aria-hidden="true">
        <div>
          <small>01</small>
          <span>Realtime 3D</span>
        </div>
        <div>
          <small>02</small>
          <span>WebGL / Three.js</span>
        </div>
        <div>
          <small>03</small>
          <span>Interaction design</span>
        </div>
      </aside>

      <div class="hero__scroll">
        <span>Scroll</span>
        <b></b>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
