<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sri Murugan Travel Agency — Madurai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/hero.css" />
  </head>
  <body>
    <div class="cursor" id="cursor" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="18" />
        <path d="M24 8v6M24 34v6M8 24h6M34 24h6M24 24l8-10" />
      </svg>
    </div>

    <section class="hero is-booting" id="hero">
      <div class="boot" id="boot" aria-hidden="true">
        <span class="boot__ring"></span>
        <span class="boot__ring"></span>
        <span class="boot__mark">SM</span>
        <small>Sri Murugan Travels · Madurai</small>
      </div>

      <div class="reel" id="reel"></div>
      <div class="veil" aria-hidden="true"></div>

      <header class="nav">
        <a class="brand" href="https://www.srimurugantravel.com/">
          <b>SM</b>
          <span>Sri Murugan Travels<small>IATA · Since 1985 · Madurai</small></span>
        </a>
        <nav>
          <a href="https://www.srimurugantravel.com/">Tours</a>
          <a href="https://www.srimurugantravel.com/rameshwaram">Rameshwaram</a>
          <a href="https://www.srimurugantravel.com/">International</a>
        </nav>
        <a class="call" href="tel:+919791848265">97918 48265</a>
      </header>

      <div class="hud">
        <div class="meter">
          <svg class="meter__ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="44"></circle>
            <circle class="meter__run" cx="50" cy="50" r="44"></circle>
          </svg>
          <div class="odometer" id="odometer"><span>0</span><span>1</span></div>
        </div>

        <p class="kicker" id="kicker">Temple city</p>
        <h1 class="title" id="title">MEENAKSHI</h1>
        <p class="tamil" id="tamil">மீனாட்சி · மதுரை</p>
        <p class="lede" id="lede"></p>
        <p class="fare"><span id="fare">5500</span><small>INR onwards · Ex Madurai</small></p>
        <div class="cta">
          <a class="cta__main" href="https://www.srimurugantravel.com/" data-ripple>Book this journey</a>
          <a class="cta__ghost" href="tel:+919791848265">Talk to SMTA</a>
        </div>

        <svg class="route" viewBox="0 0 420 86" fill="none" aria-hidden="true">
          <path class="route__line" d="M18 68 C90 68 110 18 180 22 C250 26 270 70 340 52 C380 42 400 28 404 20" />
          <circle class="route__dot" cx="18" cy="68" r="7" />
          <circle class="route__head" cx="404" cy="20" r="8" />
          <text x="8" y="84">Madurai</text>
          <text id="route-end" x="330" y="14">Meenakshi</text>
        </svg>
      </div>

      <aside class="index" id="index"></aside>

      <div class="coverflow" id="coverflow"></div>
    </section>

    <script src="./js/hero.js"></script>
  </body>
</html>
