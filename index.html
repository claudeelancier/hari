<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sri Murugan Travel Agency — Madurai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/hero.css" />
  </head>
  <body>
    <div class="trail" id="trail" aria-hidden="true"></div>

    <section class="hero is-booting" id="hero">
      <div class="boot" aria-hidden="true">
        <i class="fold fold--tl"></i>
        <i class="fold fold--tr"></i>
        <i class="fold fold--bl"></i>
        <i class="fold fold--br"></i>
        <div class="boot__core">
          <b>SM</b>
          <small>Unfolding your next yatra</small>
        </div>
      </div>

      <div class="mosaic" id="mosaic"></div>
      <div class="veil" aria-hidden="true"></div>

      <header class="nav">
        <a class="brand" href="https://www.srimurugantravel.com/">
          <b>SM</b>
          <span>Sri Murugan Travels<small>IATA · Since 1985 · Madurai</small></span>
        </a>
        <nav>
          <a href="https://www.srimurugantravel.com/">Tours</a>
          <a href="https://www.srimurugantravel.com/rameshwaram">Rameshwaram</a>
          <a href="https://www.srimurugantravel.com/">International</a>
        </nav>
        <a class="call" href="tel:+919791848265">97918 48265</a>
      </header>

      <div class="hud">
        <p class="kicker" id="kicker"></p>
        <div class="slot" aria-live="polite">
          <div class="slot__window">
            <div class="slot__reel" id="slot"></div>
          </div>
        </div>
        <p class="tamil" id="tamil">மீனாட்சி · மதுரை</p>
        <p class="lede" id="lede"></p>
        <p class="fare"><span id="fare">5,500</span><small>INR onwards · Ex Madurai</small></p>
        <div class="cta">
          <a class="cta__main" href="https://www.srimurugantravel.com/">Book this journey</a>
          <a class="cta__ghost" href="tel:+919791848265">Talk to SMTA</a>
        </div>
        <div class="bars" id="bars"></div>
      </div>

      <div class="polaroids" id="polaroids"></div>
    </section>

    <script src="./js/hero.js"></script>
  </body>
</html>
