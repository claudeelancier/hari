<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sri Murugan Travel Agency — Madurai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/hero.css" />
  </head>
  <body>
    <svg class="fx" aria-hidden="true">
      <filter id="ripple" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="0" />
      </filter>
    </svg>

    <section class="hero" id="hero">
      <div class="worlds" id="worlds"></div>
      <div class="veil" aria-hidden="true"></div>
      <div class="beam" aria-hidden="true"></div>

      <header class="nav">
        <a class="brand" href="https://www.srimurugantravel.com/">
          <b>SM</b>
          <span>Sri Murugan Travels<small>IATA · Since 1985 · Madurai</small></span>
        </a>
        <nav>
          <a href="https://www.srimurugantravel.com/">Tours</a>
          <a href="https://www.srimurugantravel.com/rameshwaram">Rameshwaram</a>
          <a href="https://www.srimurugantravel.com/">International</a>
        </nav>
        <a class="call" href="tel:+919791848265">97918 48265</a>
      </header>

      <div class="hud">
        <p class="kicker" id="kicker">Temple city</p>
        <p class="num" id="num">01</p>
        <h1 class="mask" id="mask">MEENAKSHI</h1>
        <p class="tamil" id="tamil">மீனாட்சி · மதுரை</p>
        <p class="lede" id="lede"></p>
        <p class="fare"><span id="fare">5,500</span><small>INR onwards · Ex Madurai</small></p>
        <div class="cta">
          <a class="cta__main" href="https://www.srimurugantravel.com/">Book this journey</a>
          <a class="cta__ghost" href="tel:+919791848265">Talk to SMTA</a>
        </div>
      </div>

      <div class="pills" id="pills"></div>
    </section>

    <script src="./js/hero.js"></script>
  </body>
</html>
