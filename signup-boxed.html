<body class="auth-boxed-page"><div class="auth-card"><a class="brand" href="index.html" style="margin-bottom:24px;display:inline-flex"><span class="brand-mark">N</span> Nuvora</a>
    <h2>Create your account</h2>
    <form data-validate><div class="form-group"><label for="name">Full name</label><input id="name" class="form-control-nuvora" required></div><div class="form-group"><label for="email">Email</label><input id="email" type="email" class="form-control-nuvora" required></div>
    <div class="form-group"><label for="password">Password</label><input id="password" type="password" class="form-control-nuvora" required></div><div class="form-group"><label for="confirm">Confirm password</label><input id="confirm" type="password" class="form-control-nuvora" required></div><label class="check-row" style="justify-content:flex-start;gap:8px"><input type="checkbox" required> I agree to the Terms</label><button class="btn-nuvora primary block" type="submit">Create Account</button>
    <div class="or-div">or</div>
    <button class="btn-nuvora outline block" type="button"><i class="bi bi-google"></i> Continue with Google</button>
    <p style="margin-top:16px;text-align:center">Already have an account? <a href="login-boxed.html">Log in</a></p>
    <p class="form-msg"></p></form></div><script src="js/main.js"></script></body></html>
